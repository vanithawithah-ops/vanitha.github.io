        /* Desktop nav */
        .dp-nav-desktop {
          display: flex;
          gap: clamp(20px,3vw,40px);
          align-items: center;
        }
        .dp-hamburger { display: none !important; }

        /* Tablet & mobile: swap to hamburger */
        @media (max-width: 768px) {
          .dp-nav-desktop { display: none !important; }
          .dp-hamburger { display: flex !important; align-items: center; justify-content: center; }
        }

        /* Mobile: single-column everything */
        @media (max-width: 640px) {
          .dp-hero-grid { grid-template-columns: 1fr !important; }
          .dp-challenges-grid { grid-template-columns: 1fr !important; }
          .dp-challenge-row { grid-template-columns: 1fr !important; gap: 6px !important; }
          .dp-who-grid { grid-template-columns: 1fr !important; }
          .dp-founder-grid { grid-template-columns: 1fr !important; }
          .dp-cta-grid { grid-template-columns: 1fr !important; }

          /* Framework: stack num + content, hide output column */
          .dp-framework-row { grid-template-columns: 48px 1fr !important; }
          .dp-framework-output { display: none !important; }

          /* Role flow: vertical stack, hide arrows */
          .dp-role-flow {
            display: flex !important;
            flex-direction: column !important;
            gap: 0 !important;
          }
          .dp-role-arrow { display: none !important; }

          /* Stats stay 2-col on mobile */
          .dp-stats-grid { grid-template-columns: 1fr 1fr !important; }
